chart-dir: helm/aws-efs-csi-driver
generate-metadata: true
catalog-base-url: https://giantswarm.github.io/giantswarm-catalog/
ct-config: ./.circleci/ct-config.yaml
# The bundle chart in this repo reads its crossplane config from a live ConfigMap via helm's
# `lookup`, and hard-fails when it isn't found. `lookup` always returns empty under
# `helm template`, so ABS 2.2.0's HelmTemplateValidator can never render this chart -- no
# values can substitute for cluster state. Disabling the step rather than leaving CI red.
disable-helm-template-validator: true
