{{- if and .Values.global.podSecurityStandards.enforced .Values.kyvernoPolicyExceptions.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: efs-csi-controller-exceptions
  namespace: giantswarm
  labels:
    {{- include "aws-efs-csi-driver.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  policyRefs:
    - name: require-run-as-non-root-user
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: disallow-privilege-escalation
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-privileged-containers
      kind: ValidatingPolicy
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
    - name: restrict-volume-types
      kind: ValidatingPolicy
    # require-non-root-groups is missing from the legacy exception. It is excepted
    # because the efs-csi-controller Deployment fails it.
    - name: require-non-root-groups
      kind: ValidatingPolicy
    # require-container-requests-and-limits is a supplemental policy and usually
    # not enabled. It is excepted because the efs-csi-controller Deployment fails
    # it when the policy is enforced.
    - name: require-container-requests-and-limits
      kind: ValidatingPolicy
    # require-emptydir-requests-and-limits is a supplemental policy and usually
    # not enabled. It is excepted because the efs-csi-controller Deployment fails
    # it when the policy is enforced.
    - name: require-emptydir-requests-and-limits
      kind: ValidatingPolicy
    # require-pod-probes is a supplemental policy and usually not enabled. It is
    # excepted because the efs-csi-controller Deployment fails it when the policy
    # is enforced.
    - name: require-pod-probes
      kind: ValidatingPolicy
    # require-ro-rootfs is a supplemental policy and usually not enabled. It is
    # excepted because the efs-csi-controller Deployment fails it when the policy
    # is enforced.
    - name: require-ro-rootfs
      kind: ValidatingPolicy
    # restrict-sa-automount-sa-token is a supplemental policy and usually not
    # enabled. It is excepted because the efs-csi-sa ServiceAccount fails it when
    # the policy is enforced.
    - name: restrict-sa-automount-sa-token
      kind: ValidatingPolicy
  matchConditions:
    # The second block matches the controller's ServiceAccount efs-csi-sa, which
    # fails restrict-sa-automount-sa-token and which no legacy exception covers.
    - name: efs-csi-controller-workloads
      expression: >-
        (request.kind.kind in ['Deployment', 'ReplicaSet', 'Pod'] &&
        request.namespace == '{{ .Release.Namespace }}' &&
        has(object.metadata.name) &&
        (object.metadata.name == 'efs-csi-controller' || object.metadata.name.startsWith('efs-csi-controller-'))) ||
        (request.kind.kind == 'ServiceAccount' &&
        request.namespace == '{{ .Release.Namespace }}' &&
        has(object.metadata.name) &&
        object.metadata.name == 'efs-csi-sa')
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: efs-csi-node-exceptions
  namespace: giantswarm
  labels:
    {{- include "aws-efs-csi-driver.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  policyRefs:
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
    - name: restrict-volume-types
      kind: ValidatingPolicy
    - name: require-run-as-non-root-user
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: disallow-privilege-escalation
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-privileged-containers
      kind: ValidatingPolicy
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
    # require-non-root-groups is missing from the legacy exception. It is excepted
    # because the efs-csi-node DaemonSet fails it.
    - name: require-non-root-groups
      kind: ValidatingPolicy
    # require-container-requests-and-limits is a supplemental policy and usually
    # not enabled. It is excepted because the efs-csi-node DaemonSet fails it when
    # the policy is enforced.
    - name: require-container-requests-and-limits
      kind: ValidatingPolicy
    # require-pod-probes is a supplemental policy and usually not enabled. It is
    # excepted because the efs-csi-node DaemonSet fails it when the policy is
    # enforced.
    - name: require-pod-probes
      kind: ValidatingPolicy
    # require-ro-rootfs is a supplemental policy and usually not enabled. It is
    # excepted because the efs-csi-node DaemonSet fails it when the policy is
    # enforced.
    - name: require-ro-rootfs
      kind: ValidatingPolicy
    # restrict-sa-automount-sa-token is a supplemental policy and usually not
    # enabled. It is excepted because the efs-csi-node-sa ServiceAccount fails it
    # when the policy is enforced.
    - name: restrict-sa-automount-sa-token
      kind: ValidatingPolicy
  matchConditions:
    - name: efs-csi-node-workloads
      # ServiceAccount is matched for restrict-sa-automount-sa-token.
      expression: >-
        request.kind.kind in ['DaemonSet', 'Pod', 'ServiceAccount'] &&
        request.namespace == '{{ .Release.Namespace }}' &&
        has(object.metadata.name) &&
        (object.metadata.name == 'efs-csi-node' || object.metadata.name.startsWith('efs-csi-node-'))
{{- end }}
